<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARO BabyLM — Live Training</title>
  <style>
    :root{color-scheme:dark;--bg:#080a10;--panel:#111521;--line:#293149;--text:#f0f3ff;--muted:#8992aa;--cyan:#59e1ff;--violet:#ad8cff;--green:#66e6a4}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0,#15203a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:32px auto 56px} header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
    h1{font-size:clamp(27px,4vw,48px);line-height:1;margin:0;letter-spacing:-.04em} .eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}.private{color:var(--muted);font-size:12px;text-align:right}
    .progress{height:10px;background:#1b2030;border-radius:20px;overflow:hidden;margin:18px 0 22px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 20px var(--cyan);transition:width .6s}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.chart{background:linear-gradient(180deg,#141927dd,#0e121bdd);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 50px #0005}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums}.loss-values{display:flex;gap:18px;align-items:end;margin-top:5px}.loss-value{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}.loss-key{font-size:10px;letter-spacing:.08em;margin-top:1px}.instant{color:var(--cyan)}.average{color:var(--violet)}.chart{margin-top:12px;padding:18px 18px 12px}.chart h2{font-size:15px;margin:0 0 12px}canvas{width:100%;height:260px;display:block}.milestones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.mile{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;color:var(--muted)}.mile.ready{border-color:#3d8466;color:var(--green);background:#10251d}.score{font-size:20px;font-weight:800;color:var(--text);margin-top:4px}.footer{color:var(--muted);font-size:12px;margin-top:14px;display:flex;justify-content:space-between}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.milestones{grid-template-columns:repeat(3,1fr)}header{align-items:start;flex-direction:column}.private{text-align:left}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Live training broadcast</div><h1>ARO BabyLM <span style="color:var(--cyan)">LIVE</span></h1></div><div class="private">METRICS ONLY<br>モデル重み・checkpoint非公開</div></header>
  <div class="progress"><i id="bar"></i></div>
  <section class="grid">
    <div class="card"><div class="label">WORDS</div><div class="value" id="words">—</div></div>
    <div class="card"><div class="label">LOSS</div><div class="loss-values"><div><div class="loss-value instant" id="lossInstant">—</div><div class="loss-key instant">INSTANT</div></div><div><div class="loss-value average" id="lossAverage">—</div><div class="loss-key average">MA 50 STEPS</div></div></div></div>
    <div class="card"><div class="label">LEARNING RATE</div><div class="value" id="lr">—</div></div>
    <div class="card"><div class="label">ETA</div><div class="value" id="eta">計測中</div></div>
  </section>
  <section class="chart"><h2>Training loss <span style="color:var(--muted);font-weight:400">— 瞬間値 / <span style="color:var(--violet)">50step移動平均</span></span></h2><canvas id="lossChart"></canvas></section>
  <section class="chart"><h2>100M checkpoints / Fast BLiMP速報</h2><div class="milestones" id="milestones"></div></section>
  <div class="footer"><span id="state">接続中…</span><span id="updated"></span></div>
</main>
<script>
const $=id=>document.getElementById(id); const fmt=n=>Number(n).toLocaleString('ja-JP');
function duration(s){if(!s||!isFinite(s))return '計測中';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return `${h}h ${m}m`}
function draw(rows){const c=$('lossChart'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,w,h);if(rows.length<2)return;const vals=rows.map(r=>r.loss).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),pad=28;x.strokeStyle='#293149';x.lineWidth=1;for(let i=0;i<5;i++){let y=pad+(h-2*pad)*i/4;x.beginPath();x.moveTo(pad,y);x.lineTo(w-pad,y);x.stroke()}const point=(v,i)=>[pad+(w-2*pad)*i/(rows.length-1),pad+(h-2*pad)*(max-v)/(max-min||1)];x.strokeStyle='#59e1ff66';x.lineWidth=1;x.beginPath();rows.forEach((r,i)=>{const [px,py]=point(r.loss,i);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.strokeStyle='#ad8cff';x.lineWidth=3;x.beginPath();rows.forEach((r,i)=>{const [px,py]=point(r.loss_ma50,i);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
const STATUS_ENDPOINT=location.hostname==='awakeningos.github.io'?'https://c3ded09318fcf4.lhr.life/api/status':'/api/status';
async function tick(){try{const d=await fetch(STATUS_ENDPOINT,{cache:'no-store'}).then(r=>r.json()),r=d.latest||{},curve=d.curve||[],last=curve.at(-1)||{};$('bar').style.width=(d.progress*100).toFixed(3)+'%';$('words').textContent=(r.words_seen? (r.words_seen/1e6).toFixed(2)+'M':'—');$('lossInstant').textContent=Number.isFinite(r.loss)?r.loss.toFixed(4):'—';$('lossAverage').textContent=Number.isFinite(last.loss_ma50)?last.loss_ma50.toFixed(4):'—';$('lr').textContent=Number.isFinite(r.lr)?r.lr.toExponential(3):'—';$('eta').textContent=duration(d.eta_seconds);$('state').textContent=`${d.run_state} · service ${d.service} · step ${fmt(r.optimizer_step||0)} · Seq${r.sequence_length||'—'}`;$('updated').textContent=new Date().toLocaleTimeString('ja-JP');draw(curve);const scores=new Map((d.fast_points||[]).map(p=>[p.words_m,p]));$('milestones').innerHTML=(d.checkpoints||[]).map(p=>{const s=scores.get(p.words_m);return `<div class="mile ${p.ready?'ready':''}"><b>${p.words_m}M</b><div class="score">${s&&s.blimp!=null?s.blimp.toFixed(2):'—'}</div><small>${s?(s.verified?'verified':'unverified'):(p.ready?'checkpoint':'waiting')}</small></div>`}).join('')}catch(e){$('state').textContent='再接続中…'}}
tick();setInterval(tick,5000);addEventListener('resize',tick);
</script></body></html>
